spring:
  application:
    name: vidacruz-triage
  reactor:
    context-propagation: auto
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidacruz}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_TRIAGE_TOPIC:triaje.eventos}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  alerts:
    webhook:
      enabled: ${TRIAGE_ALERT_WEBHOOK_ENABLED:false}
      url: ${TRIAGE_ALERT_WEBHOOK_URL:}
      consumer-group-id: ${TRIAGE_ALERT_WEBHOOK_CONSUMER_GROUP:vidacruz-triage-alerts}
  triage:
    escalation:
      poll-interval-ms: ${TRIAGE_ESCALATION_POLL_INTERVAL_MS:1000}
    sla:
      critico: ${TRIAGE_SLA_CRITICO_MINUTOS:5}
      urgente: ${TRIAGE_SLA_URGENTE_MINUTOS:10}
      urgente2: ${TRIAGE_SLA_URGENTE_2_MINUTOS:30}
      no-urgente: ${TRIAGE_SLA_NO_URGENTE_MINUTOS:60}
      no-urgente2: ${TRIAGE_SLA_NO_URGENTE_2_MINUTOS:120}
